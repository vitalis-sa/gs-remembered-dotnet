# CI/CD da API .NET do cuidador (seção 8 do plano).
# Roda só depois do merge na main: sem gatilho de PR, a main protegida exige PR com revisor.
# Segredos ficam no grupo de variáveis "cuidar-de-perto-segredos" (Pipelines > Library),
# todos marcados como secretos: ORACLE_CONNECTION, JWT_SECRET, CLOUDAMQP_URL, JAVA_BASE_URL.

trigger:
  branches:
    include:
      - main
pr: none

variables:
  - group: cuidar-de-perto-segredos
  - name: buildConfiguration
    value: Release
  # Nome da conexão de serviço (Project settings > Service connections) e do Web App do script 01.
  - name: azureSubscription
    value: sc-cuidar-de-perto
  - name: webAppName
    value: cuidar-de-perto-dotnet-rm561489

stages:
  - stage: Build
    displayName: Build e testes
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          # SDK 8: os testes de integração compilam em net8.0, o mesmo runtime do App Service.
          - task: UseDotNet@2
            displayName: SDK .NET 8
            inputs:
              packageType: sdk
              version: 8.0.x

          - script: dotnet restore CuidarDePerto.sln
            displayName: restore

          - script: dotnet build CuidarDePerto.sln --configuration $(buildConfiguration) --no-restore
            displayName: build

          - script: >
              dotnet test CuidarDePerto.sln --configuration $(buildConfiguration) --no-build
              --logger trx --results-directory $(Agent.TempDirectory)/testes
              --collect "XPlat Code Coverage"
            displayName: test (unidade e integração)

          - task: PublishTestResults@2
            displayName: Publicar resultados dos testes
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/testes/**/*.trx'
              testRunTitle: CuidarDePerto $(Build.BuildNumber)
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/testes/**/coverage.cobertura.xml'

          - script: >
              dotnet publish src/CuidarDePerto.Api/CuidarDePerto.Api.csproj
              --configuration $(buildConfiguration) --no-build
              --output $(Build.ArtifactStagingDirectory)/api
            displayName: publish

          - task: ArchiveFiles@2
            displayName: Compactar artefato .zip
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/api
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/cuidar-de-perto-api-$(Build.BuildId).zip

          - task: PublishPipelineArtifact@1
            displayName: Publicar artefato
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/cuidar-de-perto-api-$(Build.BuildId).zip
              artifact: api

  - stage: Deploy
    displayName: Deploy no App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy automático
        environment: producao
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(webAppName)
                    runtimeStack: DOTNETCORE|8.0
                    package: $(Pipeline.Workspace)/api/*.zip
                    # Os segredos vêm do grupo de variáveis; o YAML só referencia os nomes.
                    appSettings: >-
                      -ASPNETCORE_ENVIRONMENT Production
                      -ConnectionStrings__Oracle "$(ORACLE_CONNECTION)"
                      -Jwt__Key "$(JWT_SECRET)"
                      -Jwt__Issuer remembered-dotnet
                      -Jwt__Audience remembered
                      -Jwt__IssuersAceitos__0 remembered-java
                      -Java__BaseUrl "$(JAVA_BASE_URL)"
                      -RabbitMq__Enabled true
                      -RabbitMq__Uri "$(CLOUDAMQP_URL)"

                - script: |
                    for i in $(seq 1 20); do
                      codigo=$(curl -s -o /dev/null -w '%{http_code}' https://$(webAppName).azurewebsites.net/health || true)
                      echo "tentativa $i: /health -> $codigo"
                      [ "$codigo" = "200" ] && exit 0
                      sleep 15
                    done
                    echo "##vso[task.logissue type=error]/health não respondeu 200 depois do deploy"
                    exit 1
                  displayName: Conferir /health na nuvem
